<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Main glossy tile gradient -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#315a86"/>
      <stop offset="42%" stop-color="#173554"/>
      <stop offset="100%" stop-color="#0b1b2d"/>
    </linearGradient>

    <!-- Top highlight -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle inner glow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.45"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background -->
  <g filter="url(#shadow)">
    <!-- Outer rim -->
    <rect x="5" y="5" width="118" height="118" rx="19"
          fill="#071321" stroke="#456987" stroke-width="3"/>

    <!-- Main block -->
    <rect x="9" y="9" width="110" height="110" rx="16"
          fill="url(#tile)" stroke="#6e9ab9" stroke-width="2"/>

    <!-- Top glossy surface -->
    <path d="M12 25 Q12 12 25 12 H103 Q116 12 116 25 V43 H12 Z"
          fill="url(#shine)"/>

    <!-- Inner border -->
    <rect x="14" y="14" width="100" height="100" rx="12"
          fill="none" stroke="#9bc2dd" stroke-opacity="0.25" stroke-width="2"/>

    <!-- Small corner highlights -->
    <path d="M25 17 H91" stroke="#ffffff" stroke-opacity="0.28"
          stroke-width="2.5" stroke-linecap="round"/>
    <path d="M17 28 V39" stroke="#ffffff" stroke-opacity="0.18"
          stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bottom depth -->
    <path d="M22 112 H106 Q113 112 113 105"
          fill="none" stroke="#020914" stroke-opacity="0.65"
          stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
